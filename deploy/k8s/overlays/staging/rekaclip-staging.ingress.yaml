apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rekaclip-staging
  namespace: rekaclip-staging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: nginx
  rules:
    - host: staging.rekaclip.homes
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rekaclip
                port:
                  number: 80
  tls:
    - secretName: rekaclip-staging-tls
      hosts:
        - staging.rekaclip.homes
