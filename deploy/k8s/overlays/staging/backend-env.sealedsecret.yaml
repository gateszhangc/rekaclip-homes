    AUTH_DISABLED: 
    BACKEND_SERVER_HOST: 
    DATABASE_URL: 
    DB_WRITE_FREEZE: 
    ENCRYPTION_KEY: 
    NODE_ENV: 
    OPENCLAW_DEPLOY_MODE: 
    OPENCLAW_HOMEPAGE_PROVIDER_MODE: 
    OPENCLAW_IMAGE: 
    OPENCLAW_K8S_AUTO_UPDATE_FOR_OPENROUTER: 
    OPENCLAW_K8S_LIMIT_CPU: 
    OPENCLAW_K8S_LIMIT_MEMORY: 
    OPENCLAW_K8S_NAMESPACE: 
    OPENCLAW_K8S_NODE_SELECTOR_JSON: 
    OPENCLAW_K8S_PVC_SIZE: 
    OPENCLAW_K8S_REQUEST_CPU: 
    OPENCLAW_K8S_REQUEST_MEMORY: 
    OPENCLAW_K8S_STORAGE_CLASS: 
    OPENCLAW_MODEL: 
    OPENCLAW_POOL_PREWARM_CONCURRENCY: 
    OPENCLAW_POOL_PREWARM_ENABLED: 
    OPENCLAW_POOL_PREWARM_INTERVAL_MS: 
    OPENCLAW_READY_WAIT_MS: 
    OPENCLAW_RUNTIME_PROVIDER: 
    OPENCLAW_TARGET_HOST: 
    OPENCLAW_TARGET_HOST_POOL_JSON: 
    OPENCLAW_TARGET_HOST_STATE_FILE: 
