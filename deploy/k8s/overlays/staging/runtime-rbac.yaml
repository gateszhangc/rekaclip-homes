apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rekaclip-backend-openclaw-runtime
  namespace: rekaclip-openclaw-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rekaclip-backend-openclaw-runtime
  namespace: rekaclip-openclaw-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: rekaclip-backend
    namespace: rekaclip-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rekaclip-backend-openclaw-runtime
