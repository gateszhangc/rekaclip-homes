apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rekaclip-live
  namespace: rekaclip
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: nginx
  rules:
    - host: www.rekaclip.homes
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rekaclip
                port:
                  number: 80
    - host: rekaclip.homes
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rekaclip
                port:
                  number: 80
  tls:
    - secretName: rekaclip-live-tls
      hosts:
        - www.rekaclip.homes
        - rekaclip.homes
