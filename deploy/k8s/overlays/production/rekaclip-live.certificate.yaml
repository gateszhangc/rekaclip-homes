apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rekaclip-live-tls
  namespace: rekaclip
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: rekaclip-live-tls
  dnsNames:
    - www.rekaclip.homes
    - rekaclip.homes
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
